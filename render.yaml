services:
  - type: web
    name: worksphere-analytics-nitinsharma
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    rootDir: analytics-service
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: INTERNAL_API_KEY
        generateValue: true

  - type: web
    name: worksphere-production-api-nitinsharma
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build:backend
    startCommand: npm run start --workspace backend
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      - key: NODE_ENV
        value: production
      - key: EMAIL_PROVIDER
        value: mock
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ANALYTICS_INTERNAL_API_KEY
        fromService:
          name: worksphere-analytics-nitinsharma
          type: web
          envVarKey: INTERNAL_API_KEY
      - key: ANALYTICS_SERVICE_URL
        fromService:
          name: worksphere-analytics-nitinsharma
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: APP_URL
        value: https://worksphere-web-nitinsharma.onrender.com
      - key: CORS_ORIGIN
        value: https://worksphere-web-nitinsharma.onrender.com

  - type: web
    name: worksphere-web-nitinsharma
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build:frontend
    startCommand: npm run start --workspace frontend
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://worksphere-production-api-nitinsharma.onrender.com/api/v1
      - key: NEXT_PUBLIC_SOCKET_URL
        value: https://worksphere-production-api-nitinsharma.onrender.com
