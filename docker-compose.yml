version: '3.8'

networks:
  worksphere-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  backend_uploads:

services:
  postgres:
    image: postgres:16-alpine
    container_name: worksphere-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-worksphere}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in an untracked environment file}
      POSTGRES_DB: ${POSTGRES_DB:-worksphere_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/01-init.sql
    networks:
      - worksphere-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worksphere -d worksphere_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: worksphere-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - worksphere-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    container_name: worksphere-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in an untracked environment file}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in an untracked environment file}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - worksphere-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  analytics-service:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    container_name: worksphere-analytics
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      PORT: 8000
      INTERNAL_API_KEY: ${ANALYTICS_INTERNAL_API_KEY:?Set ANALYTICS_INTERNAL_API_KEY in an untracked environment file}
      CORS_ORIGINS: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "8000:8000"
    networks:
      - worksphere-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: worksphere-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      API_BASE_URL: http://backend:4000/api/v1
      DATABASE_URL: "postgresql://${POSTGRES_USER:-worksphere}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in an untracked environment file}@postgres:5432/${POSTGRES_DB:-worksphere_db}?schema=public"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in an untracked environment file}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in an untracked environment file}
      ANALYTICS_SERVICE_URL: http://analytics-service:8000
      ANALYTICS_INTERNAL_API_KEY: ${ANALYTICS_INTERNAL_API_KEY:?Set ANALYTICS_INTERNAL_API_KEY in an untracked environment file}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      STORAGE_MODE: local
      EMAIL_PROVIDER: mock
    ports:
      - "4000:4000"
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - worksphere-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: worksphere-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      NEXT_PUBLIC_SOCKET_URL: http://localhost:4000
    ports:
      - "3000:3000"
    networks:
      - worksphere-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 20s
      timeout: 5s
      retries: 3
